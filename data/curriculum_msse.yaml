# MS in Software Engineering — Data Science Specialization
# Source: https://www.sjsu.edu/msse/program-requirements/data-science.php
# Catalog: https://catalog.sjsu.edu/preview_course_nopop.php?catoid=2&coid=...
#
# Corequisites:
#   CMPE-273, 281, 283, 279 require CMPE-272 concurrently or prior
#   CMPE-285, 287 require CMPE-202 concurrently or prior
#   These are stored as requires_all / requires_one_of for advising accuracy.
#
# Shared courses with MSAI (MERGE-safe — Neo4j idempotent):

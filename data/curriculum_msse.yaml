    name: "Specialization Elective Courses"
    min_units: 3
  gwar:
    entity_id: MSSE_GWAR
    name: "Graduate Writing (GWAR)"
  culminating:
    entity_id: MSSE_CULMINATING
    name: "Culminating Experience"


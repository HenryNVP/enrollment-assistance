# MS in Artificial Intelligence — curated graph (deterministic).
# OR-prereqs are stored as:
#   - Course.prereq_one_of (list), and
#   - :REQUIRES edges with or_group=true (for graph counts / Browser).
# AND-prereqs use :REQUIRES with or_group=false (default).
#
# Electives (9 units): Area A below are typical MS-AI electives; same courses may also
# satisfy specialization — both IN_SPECIALIZATION and IN_ELECTIVE_GROUP apply.

version: 1
program:
  entity_id: MSAI
  name: "MS in Artificial Intelligence"
  total_units: 33

departments:
  - entity_id: CMPE
    name: "Computer Engineering"
  - entity_id: ISE
    name: "Industrial and Systems Engineering"
  - entity_id: ENGR
    name: "Engineering (General)"

specializations:
  - entity_id: MSAI_SPEC_DATA_SCIENCE
    name: "Data Science"
  - entity_id: MSAI_SPEC_AUTONOMOUS_SYSTEMS
    name: "Autonomous Systems"

groups:
  core:
    entity_id: MSAI_CORE
    name: "Core Courses"
    min_units: 9
  elective:
    entity_id: MSAI_ELECTIVE
    name: "Elective Courses (Area A examples; 9 units total per catalog)"
    min_units: 9
  gwar:
    entity_id: MSAI_GWAR
    name: "Graduate Writing (GWAR)"
  culminating:
    entity_id: MSAI_CULMINATING
    name: "Culminating Experience"

courses:
  # --- Core (9 units) ---
  - course_code: CMPE-252
    title: "Artificial Intelligence and Data Engineering"
    units: 3
    department: CMPE
    requires_all: []
    requires_one_of: []
    in_core_group: true
    in_elective_group: false
    specializations: []

  - course_code: CMPE-257
    title: "Machine Learning"
    units: 3
    department: CMPE
    requires_all: [CMPE-180A]
    requires_one_of: []
    in_core_group: true
    in_elective_group: false
    specializations: []

  - course_code: ISE-201
    title: "Math Foundations for Decision and Data Sciences"

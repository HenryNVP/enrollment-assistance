# Simplified configuration using environment variable substitution
# Set these in your shell or .env file before `docker compose up`:
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   OPENAI_API_KEY (required for RAG embeddings and Agent LLM unless using alternatives below)
#   RAG_OPENAI_API_KEY
#   POSTGRES_PORT, RAG_API_PORT, AGENT_API_PORT (optional, for port customization)
#
# Example: export OPENAI_API_KEY=sk-... && docker compose -f infrastructure/docker/docker_compose.yml up db rag_api agent_api

services:
  db:
    image: pgvector/pgvector:pg16  # Standardized on pgvector/pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  rag_api:
    build: ../../backend/services/rag_api
    env_file:
      - ../../backend/services/rag_api/.env
    environment:
      # Database connection - uses same vars as db service
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # RAG embeddings (required: set OPENAI_API_KEY or RAG_OPENAI_API_KEY)
      VECTOR_DB_TYPE: pgvector
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-}
      COLLECTION_NAME: ${COLLECTION_NAME:-policy_docs}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${RAG_API_PORT:-8010}:8000"

  agent_api:
    build: ../../backend/services/agent_ai
    env_file:
      - ../../backend/services/agent_ai/.env.development
    environment:
      # Database connection - uses same vars as db service
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Agent LLM (required: set OPENAI_API_KEY or OPENROUTER_API_KEY)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_BASE_URL: http://rag_api:8000
      # In-stack prereq gateway (overrides localhost in .env.development)
      PREREQ_GATEWAY_BASE_URL: http://prereq_gateway:8000
    depends_on:
      - rag_api
      - prereq_gateway
    ports:
      - "${AGENT_API_PORT:-8000}:8000"

  prereq_gateway:
    build: ../../backend/services/prereq_lightrag_gateway
    environment:
      # Point this at your running LightRAG server.
      # If LightRAG runs on the host machine, the default below should work.
      LIGHTRAG_BASE_URL: ${LIGHTRAG_BASE_URL:-http://host.docker.internal:9621}
      # Must match LightRAG NEO4J_WORKSPACE / graph API workspace header (e.g. ms-ai).
      LIGHTRAG_WORKSPACE: ${LIGHTRAG_WORKSPACE:-ms-ai}
      # Curated :Course graph (load with scripts/load_curriculum_neo4j.py); falls back to LightRAG if disabled or unknown course.
      CURATED_GRAPH_ENABLED: ${CURATED_GRAPH_ENABLED:-true}
      # Neo4j on host (e.g. neo4j-lightrag on 7687). Set NEO4J_PASSWORD to match your DB (export before compose up or use a .env file).
      NEO4J_URI: ${NEO4J_URI:-bolt://host.docker.internal:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      AUTO_SCAN_ON_STARTUP: ${AUTO_SCAN_ON_STARTUP:-false}
      PREREQ_DEFAULT_DEPTH: ${PREREQ_DEFAULT_DEPTH:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PREREQ_GATEWAY_PORT:-8102}:8000"

volumes:
  postgres-data:

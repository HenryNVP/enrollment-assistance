# Copy docker_compose.env.example to .env (same directory as this file), fill in values, then:
#   docker compose -f infrastructure/docker/docker_compose.yml up -d --build
#
# Required in .env: OPENAI_API_KEY, NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD
# See docker_compose.env.example for the full list of variables.

services:
  db:
    image: pgvector/pgvector:pg16  # Standardized on pgvector/pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  rag_api:
    build:
      context: ../../backend/services/rag_api
      dockerfile: Dockerfile.lite
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${RAG_API_PORT:-8010}:8000"

  agent_api:
    build: ../../backend/services/agent_ai
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      RAG_BASE_URL: http://rag_api:8000
      RAG_GRAPH_BASE_URL: http://rag_graph:8000
    depends_on:
      - rag_api
      - rag_graph
    ports:
      - "${AGENT_API_PORT:-8000}:8000"

  rag_graph:
    build: ../../backend/services/rag_graph
    environment:
      # Neo4j connection (Aura or self-hosted) — load graph first with: python scripts/load_curriculum_neo4j.py
      NEO4J_URI: ${NEO4J_URI:?set NEO4J_URI in .env}
      NEO4J_USERNAME: ${NEO4J_USERNAME:?set NEO4J_USERNAME in .env}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-}
    ports:
      - "${RAG_GRAPH_PORT:-8102}:8000"

  # --- Observability ---

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - agent_api
    restart: always

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-storage:/var/lib/grafana
      - ../../backend/services/agent_ai/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../../backend/services/agent_ai/grafana/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    restart: always

volumes:
  postgres-data:
  grafana-storage:

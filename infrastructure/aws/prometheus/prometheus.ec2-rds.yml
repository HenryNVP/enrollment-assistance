# Prometheus scrape config for infrastructure/aws/docker-compose.ec2-rds.yml
# Services resolve by Compose DNS name on the default network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: agent_api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["agent_api:8000"]

  - job_name: rag_api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["rag_api:8000"]

  - job_name: rag_graph
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["rag_graph:8000"]

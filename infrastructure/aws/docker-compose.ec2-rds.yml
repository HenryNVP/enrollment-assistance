# EC2 + RDS: RAG API, RAG Graph, and Agent API on EC2, database on RDS (no local Postgres).
# Set in .env: ECR_REGISTRY, POSTGRES_HOST, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_USER,
#              NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD (and optional NEO4J_DATABASE),
#              OPENAI_API_KEY, JWT_SECRET_KEY. For RDS set POSTGRES_SSLMODE=require.
# Run from this directory (e.g. /opt/enrollment-assistant/infrastructure/aws):
#   docker compose -f docker-compose.ec2-rds.yml up -d
# Optional Prometheus + Grafana (compose profile):
#   docker compose -f docker-compose.ec2-rds.yml --profile monitoring up -d
# UI: Prometheus http://<ec2>:9090  Grafana http://<ec2>:3000
#
# Prometheus config file: paths are relative to THIS compose file → ./prometheus/prometheus.ec2-rds.yml
# If you run compose from repo root with -f infrastructure/aws/docker-compose.ec2-rds.yml, set in .env:
#   PROMETHEUS_CONFIG=/opt/enrollment-assistant/infrastructure/aws/prometheus/prometheus.ec2-rds.yml
# Or keep a copy at repo root: prometheus/prometheus.ec2-rds.yml (included in repo).
# If Prometheus failed earlier: Docker may have created a DIRECTORY named prometheus.ec2-rds.yml — remove it:
#   rm -rf ./prometheus   # only if wrong; then git checkout prometheus/

services:
  rag_api:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY in .env}/rag_api:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DB_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST (RDS endpoint) in .env}
      DB_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      VECTOR_DB_TYPE: pgvector
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-}
      COLLECTION_NAME: ${COLLECTION_NAME:-policy_docs}
    ports:
      - "${RAG_API_PORT:-8010}:8000"
    restart: always

  agent_api:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY in .env}/agent_api:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      RAG_BASE_URL: http://rag_api:8000
      RAG_GRAPH_BASE_URL: http://rag_graph:8000
    depends_on:
      - rag_api
      - rag_graph
    ports:
      - "${AGENT_API_PORT:-8000}:8000"
    restart: always

  rag_graph:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY in .env}/rag_graph:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      NEO4J_URI: ${NEO4J_URI:?set NEO4J_URI in .env}
      NEO4J_USERNAME: ${NEO4J_USERNAME:?set NEO4J_USERNAME in .env}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-}
    ports:
      - "${RAG_GRAPH_PORT:-8102}:8000"
    restart: always

  # Optional monitoring (same Docker network → scrape by service name)
  prometheus:
    image: prom/prometheus:latest
    profiles:
      - monitoring
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus/prometheus.ec2-rds.yml}:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
    depends_on:
      - agent_api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles:
      - monitoring
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-ec2-storage:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-ec2-storage:

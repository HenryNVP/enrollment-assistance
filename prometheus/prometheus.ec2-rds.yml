# Same scrape config as infrastructure/aws/prometheus/prometheus.ec2-rds.yml
# Use when docker compose is run from the repo root so ./prometheus/ resolves here.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: agent_api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["agent_api:8000"]

  - job_name: rag_api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["rag_api:8000"]

  - job_name: rag_graph
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["rag_graph:8000"]
